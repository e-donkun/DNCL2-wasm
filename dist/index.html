<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNCL2実行環境</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --panel-bg: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: #d2d2d7;
    --accent: #0071e3;
    --accent-text: #ffffff;
    --console-bg: #1e1e1e;
    --console-text: #d4d4d4;
    --error-bg: #fdecea;
    --error-text: #b3261e;
    --gutter-bg: #f0f0f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --panel-bg: #2c2c2e;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --border: #48484a;
      --console-bg: #000000;
      --console-text: #d4d4d4;
      --error-bg: #3a1f1d;
      --error-text: #ff6b60;
      --gutter-bg: #232325;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    padding: 16px;
  }
  h1 {
    font-size: 1.25rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 0 0 16px;
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    max-width: 1100px;
    margin: 0 auto;
  }
  @media (min-width: 900px) {
    .layout { grid-template-columns: 1fr 1fr; }
  }
  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
  }
  .panel h2 {
    font-size: 0.95rem;
    margin: 0 0 8px;
  }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .panel-header h2 { margin: 0 0 8px; }
  #indexBaseSelect {
    font-size: 0.78rem;
    padding: 4px 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--text);
  }
  .code-mono {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.85rem;
    line-height: 1.5;
    tab-size: 4;
  }
  /* ---- ソースコードエディタ（行番号ガター + インデントガイド） ---- */
  .editor {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    height: 340px;
  }
  .line-numbers {
    flex: 0 0 auto;
    padding: 8px 6px 8px 8px;
    text-align: right;
    color: var(--muted);
    background: var(--gutter-bg);
    overflow: hidden;
    white-space: pre;
    user-select: none;
  }
  #src {
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    border: none;
    border-left: 1px solid var(--border);
    border-radius: 0;
    background: var(--panel-bg);
    color: var(--text);
    padding: 8px;
    resize: none;
    white-space: pre;
    overflow: auto;
  }
  #src:focus { outline: none; }
  .buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 10px 0;
  }
  button {
    font-size: 0.85rem;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--text);
    cursor: pointer;
  }
  button.primary {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  button:hover { filter: brightness(0.95); }
  button:disabled { opacity: 0.5; cursor: default; }
  #output {
    background: var(--console-bg);
    color: var(--console-text);
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.85rem;
    min-height: 200px;
    max-height: 420px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    border-radius: 8px;
    padding: 10px;
  }
  .inline-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--console-text);
    color: var(--console-text);
    font-family: inherit;
    font-size: inherit;
    outline: none;
    min-width: 4ch;
    width: 16ch;
    max-width: 100%;
    padding: 0 2px;
  }
  .inline-submit {
    margin-left: 4px;
    padding: 0 8px;
    height: 1.6em;
    line-height: 1;
    font-family: inherit;
    font-size: inherit;
    border-radius: 4px;
    border: 1px solid var(--console-text);
    background: transparent;
    color: var(--console-text);
    cursor: pointer;
    vertical-align: middle;
  }
  .inline-submit:hover { background: var(--console-text); color: var(--console-bg); }
  #errorBox {
    display: none;
    margin-top: 8px;
    background: var(--error-bg);
    color: var(--error-text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.85rem;
    white-space: pre-wrap;
  }
  #sharePanel { display: none; margin-top: 10px; }
  .share-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  #shareUrlInput {
    flex: 1 1 auto;
    min-width: 0;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.78rem;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--text);
  }
  .qr-wrap {
    display: inline-block;
    margin-top: 8px;
    padding: 8px;
    background: #ffffff;
    border-radius: 8px;
    line-height: 0;
  }
  .qr-wrap svg { display: block; width: 128px; height: 128px; }
  #tokenPanel { display: none; margin-top: 12px; }
  table.tokens {
    width: 100%;
    border-collapse: collapse;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.78rem;
  }
  table.tokens th, table.tokens td {
    border: 1px solid var(--border);
    padding: 4px 6px;
    text-align: left;
  }
  table.tokens th { color: var(--muted); }
  .hint { color: var(--muted); font-size: 0.78rem; margin-top: 6px; }
  footer { text-align: center; color: var(--muted); font-size: 0.75rem; margin-top: 20px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<h1>DNCL2実行環境</h1>
<p class="subtitle">大学入学共通テスト用プログラム表記(DNCL2)をブラウザ上で実行します。外部ネットワークへは一切アクセスしません。</p>
<div class="layout">
  <div class="panel">
    <div class="panel-header">
      <h2>ソースコード</h2>
      <select id="indexBaseSelect">
        <option value="1">配列の添字は1から始まる</option>
        <option value="0" selected>配列の添字は0から始まる</option>
      </select>
    </div>
    <div class="editor">
      <div id="lineNumbers" class="line-numbers code-mono">1</div>
      <textarea id="src" class="code-mono" spellcheck="false"></textarea>
    </div>
    <div class="buttons">
      <button class="primary" id="runBtn">実行</button>
      <button id="showTokensBtn" hidden>トークン一覧を表示</button>
      <button id="shareBtn">共有URL/QRコードを作成</button>
    </div>
    <div id="sharePanel">
      <div class="share-row">
        <input type="text" id="shareUrlInput" readonly>
        <button id="copyShareUrlBtn">コピー</button>
      </div>
      <div class="qr-wrap"><div id="qrContainer"></div></div>
    </div>
    <p class="hint"><a href="about.html">使い方・このツールについて</a></p>
  </div>
  <div class="panel">
    <h2>出力</h2>
    <div id="output" class="code-mono"></div>
    <div class="buttons">
      <button id="clearOutputBtn">出力をクリア</button>
    </div>
    <div id="errorBox"></div>
    <div id="tokenPanel">
      <h2>トークン一覧</h2>
      <div style="overflow-x:auto">
        <table class="tokens" id="tokenTable">
          <thead><tr><th>#</th><th>種別</th><th>テキスト</th><th>数値</th><th>行</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<footer>Copyright (c) 2026 <a href="https://github.com/e-donkun">Jun Suzuki</a></footer>
<script>
// ==== QRコード生成ライブラリ（vendor/qrcode-generator.js。MIT, Copyright (c) 2009 Kazuhiko Arase） ====
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';

// ==== 文字列マーシャリング用の最小限のグルーコード ====
// @assemblyscript/loaderのdemangle対象部分を、単一HTML用に手書きで再実装したもの。
const SIZE_OFFSET = -4;
const STRING_ID = 2;

function base64ToBytes(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

let memory = null;
let __new = null;
let wasmExports = null;

function newString(str) {
  const length = str.length;
  const ptr = __new(length << 1, STRING_ID);
  const U16 = new Uint16Array(memory.buffer);
  for (let i = 0, p = ptr >>> 1; i < length; ++i) U16[p + i] = str.charCodeAt(i);
  return ptr;
}

function getString(ptr) {
  if (!ptr) return "";
  const buffer = memory.buffer;
  const len = new Uint32Array(buffer)[(ptr + SIZE_OFFSET) >>> 2] >>> 1;
  const arr = new Uint16Array(buffer, ptr, len);
  let s = "";
  const CHUNK = 4096;
  for (let i = 0; i < len; i += CHUNK) {
    s += String.fromCharCode.apply(null, arr.subarray(i, Math.min(i + CHUNK, len)));
  }
  return s;
}

// ブラウザ標準のCompressionStream/DecompressionStreamの"deflate-raw"）で圧縮し、
// base64url（+/ の代わりに -_ を使い、パディング=を省略したもの）にエンコードして
// URLフラグメント（#以降）に格納する。フラグメントは外部サーバーに送信されないため、
// 「外部URLへは一切アクセスしない」という方針とも矛盾しない。
const HAS_COMPRESSION_STREAM = typeof CompressionStream !== "undefined" && typeof DecompressionStream !== "undefined";

function bytesToBase64Url(bytes) {
  let binary = "";
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function base64UrlToBytes(str) {
  let b64 = str.replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4 !== 0) b64 += "=";
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

async function compressToBase64Url(text) {
  const data = new TextEncoder().encode(text);
  const cs = new CompressionStream("deflate-raw");
  const writer = cs.writable.getWriter();
  writer.write(data);
  writer.close();
  const compressed = new Uint8Array(await new Response(cs.readable).arrayBuffer());
  return bytesToBase64Url(compressed);
}

async function decompressFromBase64Url(hash) {
  const bytes = base64UrlToBytes(hash);
  const ds = new DecompressionStream("deflate-raw");
  const writer = ds.writable.getWriter();
  writer.write(bytes);
  writer.close();
  const decompressed = await new Response(ds.readable).arrayBuffer();
  return new TextDecoder().decode(decompressed);
}

function renderQrCode(container, text) {
  container.innerHTML = "";
  const qr = qrcode(0, "M");
  qr.addData(text);
  qr.make();
  container.innerHTML = qr.createSvgTag(4, 4);
}

// GitHub Pagesなどhttp(s)配信ではディレクトリ直下のindex.htmlが自動解決されるため、
// URLを短くするために末尾のindex.htmlは省く（file://で直接開いた場合は
// ディレクトリの自動解決がされないため省略しない）。
function shareBaseUrl() {
  let pathname = location.pathname;
  if (location.protocol !== "file:") {
    pathname = pathname.replace(/index.html$/, "");
  }
  return location.origin + pathname;
}

// 共有URLのハッシュ先頭1文字は添字開始番号("0"または"1")。ソースコードの
// 復元だけでなく、配列添字が0始まり/1始まりのどちらの前提で書かれたコードかも
// あわせて復元できるようにする（DESIGN.md「配列添字の開始番号」参照）。
async function showShareUrl(srcEl, sharePanelEl, shareUrlInputEl, qrContainerEl) {
  if (!HAS_COMPRESSION_STREAM) {
    errorBoxEl.textContent = "このブラウザは共有URLの生成に必要なCompressionStream APIに対応していません。";
    errorBoxEl.style.display = "block";
    return;
  }
  const indexBasePrefix = indexBaseSelectEl.value === "1" ? "1" : "0";
  const hash = await compressToBase64Url(indexBasePrefix + srcEl.value);
  const url = shareBaseUrl() + "#" + hash;
  history.replaceState(null, "", "#" + hash);
  shareUrlInputEl.value = url;
  sharePanelEl.style.display = "block";
  renderQrCode(qrContainerEl, url);
}

// ==== インタラクティブな【外部からの入力】（Pythonのinput()風のUX） ====
//
// WASM側のrunProgram()は完全に同期実行であり、実行を途中で一時停止して
// 「ユーザーが出力欄に入力し終えるまで待つ」ことはできない。そこで、
// 「まだ答えていない入力が必要になったら、そこで例外を投げて実行全体を中断し、
// ユーザーが入力欄で入力してEnterを押したら、既に得られた回答をすべて
// 使い回しながら最初から実行し直す」というリプレイ方式で対話的な入力を実現する。
// 同じ回答を使う限りプログラムは決定的に同じところまで再現されるはずだが、
// 乱数()だけは例外なので、1回の実行セッション中は同じ乱数シードを使い回すことで
// 再実行のたびに結果が変わらないようにしている（assembly/interpreter.ts参照）。
class NeedInputSignal {
  constructor(prompt) {
    this.prompt = prompt;
  }
}

let sourceCode = "";
let indexBase = 0;
let answeredInputs = [];
let inputCallIndex = 0;
let runSeed = 0;
let roundOutput = "";
let flushedLength = 0;

// ==== ホスト実装（DESIGN.md 5.4節） ====
let outputEl, errorBoxEl, runBtnEl, indexBaseSelectEl;

function hostPrintImpl(ptr) {
  roundOutput += getString(ptr);
}
function hostInputImpl(promptPtr) {
  if (inputCallIndex < answeredInputs.length) {
    return newString(answeredInputs[inputCallIndex++]);
  }
  throw new NeedInputSignal(getString(promptPtr));
}
function hostErrorImpl(ptr) {
  errorBoxEl.textContent = getString(ptr);
  errorBoxEl.style.display = "block";
}

const TT_NAMES = [
  "NUMBER", "STRING", "IDENT", "WORD", "NEWLINE",
  "LPAREN", "RPAREN", "LBRACKET", "RBRACKET", "LBRACE", "RBRACE",
  "LINPUT", "RINPUT", "COMMA", "ASSIGN",
  "PLUS", "MINUS", "MUL", "DIV", "IDIV", "MOD",
  "EQ", "NEQ", "GT", "GE", "LT", "LE",
  "POW", "COLON", "INDENT", "DEDENT", "EOF"
];

async function initWasm() {
  const bytes = base64ToBytes(WASM_BASE64);
  const importsObj = {
    env: {
      abort(msgPtr, filePtr, line, column) {
        throw new Error("abort: " + getString(msgPtr) + " at " + getString(filePtr) + ":" + line + ":" + column);
      },
      seed() { return Date.now(); },
      hostPrint: (ptr) => hostPrintImpl(ptr),
      hostInput: (promptPtr) => hostInputImpl(promptPtr),
      hostError: (ptr) => hostErrorImpl(ptr)
    }
  };
  const { instance } = await WebAssembly.instantiate(bytes, importsObj);
  memory = instance.exports.memory;
  __new = instance.exports.__new;
  wasmExports = instance.exports;
}

function setRunning(isRunning) {
  runBtnEl.disabled = isRunning;
}

function flushNewOutput() {
  const newText = roundOutput.slice(flushedLength);
  flushedLength = roundOutput.length;
  if (newText.length > 0) {
    outputEl.appendChild(document.createTextNode(newText));
    outputEl.scrollTop = outputEl.scrollHeight;
  }
}

function run() {
  sourceCode = document.getElementById("src").value;
  indexBase = indexBaseSelectEl.value === "1" ? 1 : 0;
  outputEl.textContent = "";
  errorBoxEl.style.display = "none";
  errorBoxEl.textContent = "";
  answeredInputs = [];
  flushedLength = 0;
  runSeed = (Math.random() * 0xffffffff) >>> 0;
  setRunning(true);
  executeRound();
}

// 【外部からの入力】の入力待ち中（インラインの<input>が出力欄に挿入されている状態）に
// 出力をクリアすると、その<input>ごと消えてしまい、Enterを押しても実行が再開されず
// 「実行」ボタンも無効のまま固まってしまう。それを防ぐため、単に表示を消すだけでなく
// 実行状態（応答済み入力・シード・実行ボタンの有効/無効）も含めて完全にリセットする。
function clearOutput() {
  outputEl.textContent = "";
  errorBoxEl.style.display = "none";
  errorBoxEl.textContent = "";
  answeredInputs = [];
  inputCallIndex = 0;
  roundOutput = "";
  flushedLength = 0;
  setRunning(false);
}

function executeRound() {
  roundOutput = "";
  inputCallIndex = 0;
  wasmExports.seedRandom(runSeed);
  let needInput = false;
  let promptText = "";
  try {
    wasmExports.runProgram(newString(sourceCode), indexBase);
  } catch (e) {
    if (e instanceof NeedInputSignal) {
      needInput = true;
      promptText = e.prompt;
    } else {
      flushNewOutput();
      errorBoxEl.textContent = "内部エラー: " + (e && e.message ? e.message : String(e));
      errorBoxEl.style.display = "block";
      setRunning(false);
      return;
    }
  }
  flushNewOutput();
  if (needInput) {
    showInlinePrompt(promptText);
  } else {
    setRunning(false);
  }
}

// Pythonのinput(prompt)と同様、【】内の文字列をプロンプトとして先に表示してから
// 入力欄を出す。Enterキーに加えて[↵]ボタンでも入力を確定できるようにする。
function showInlinePrompt(promptText) {
  if (promptText) {
    outputEl.appendChild(document.createTextNode(promptText));
  }
  const input = document.createElement("input");
  input.type = "text";
  input.className = "inline-input";
  input.autocomplete = "off";
  input.spellcheck = false;
  const submitBtn = document.createElement("button");
  submitBtn.type = "button";
  submitBtn.className = "inline-submit";
  submitBtn.textContent = "↵";
  submitBtn.title = "入力を確定";
  outputEl.appendChild(input);
  outputEl.appendChild(submitBtn);
  outputEl.scrollTop = outputEl.scrollHeight;
  input.focus();

  function submit() {
    const value = input.value;
    outputEl.replaceChild(document.createTextNode(value + "\n"), input);
    outputEl.removeChild(submitBtn);
    answeredInputs.push(value);
    executeRound();
  }
  input.addEventListener("keydown", (ev) => {
    if (ev.key !== "Enter") return;
    ev.preventDefault();
    submit();
  });
  submitBtn.addEventListener("click", submit);
}

function showTokens() {
  const src = document.getElementById("src").value;
  const jsonPtr = wasmExports.tokenizeDebug(newString(src));
  const tokens = JSON.parse(getString(jsonPtr));
  const tbody = document.querySelector("#tokenTable tbody");
  tbody.innerHTML = "";
  tokens.forEach((t, i) => {
    const tr = document.createElement("tr");
    const typeName = TT_NAMES[t.type] || String(t.type);
    tr.innerHTML =
      "<td>" + i + "</td>" +
      "<td>" + typeName + "</td>" +
      "<td>" + escapeHtml(t.text) + "</td>" +
      "<td>" + t.num + "</td>" +
      "<td>" + t.line + "</td>";
    tbody.appendChild(tr);
  });
  document.getElementById("tokenPanel").style.display = "block";
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ==== エディタの行番号ガター ====
function updateLineNumbers() {
  const src = document.getElementById("src");
  const lineNumbersEl = document.getElementById("lineNumbers");
  const lineCount = src.value.split("\n").length;
  const lines = new Array(lineCount);
  for (let i = 0; i < lineCount; i++) lines[i] = i + 1;
  lineNumbersEl.textContent = lines.join("\n");
}

window.addEventListener("DOMContentLoaded", async () => {
  outputEl = document.getElementById("output");
  errorBoxEl = document.getElementById("errorBox");
  runBtnEl = document.getElementById("runBtn");
  indexBaseSelectEl = document.getElementById("indexBaseSelect");
  const srcEl = document.getElementById("src");
  const lineNumbersEl = document.getElementById("lineNumbers");
  const sharePanelEl = document.getElementById("sharePanel");
  const shareUrlInputEl = document.getElementById("shareUrlInput");
  const qrContainerEl = document.getElementById("qrContainer");

  // URLの#以降に共有用のソースコードが埋め込まれていれば、それを初期値にする。
  // 先頭1文字は添字開始番号("0"/"1")なので、プルダウンにも反映する。
  let initialSource = null;
  let initialIndexBase = null;
  const hash = location.hash.replace(/^#/, "");
  if (hash && HAS_COMPRESSION_STREAM) {
    try {
      const decoded = await decompressFromBase64Url(hash);
      initialIndexBase = decoded.charAt(0) === "1" ? "1" : "0";
      initialSource = decoded.slice(1);
    } catch (e) {
      console.error("Failed to restore source code from URL", e);
    }
  }
  srcEl.value = initialSource !== null ? initialSource : "# 配列から最大値を探す\nData = [3, 7, 2, 9, 4]\nsaidai = Data[0]\ni を 0 から 4 まで 1 ずつ増やしながら繰り返す:\n    もし Data[i] > saidai ならば:\n        saidai = Data[i]\n表示する(\"saidai = \", saidai)\n\n# べき乗演算子と整数への切り捨て\n表示する(\"2 ** 10 = \", 2 ** 10)\n表示する(\"整数(3.9) = \", 整数(3.9))\n\n# 論理演算子 and/or/not（優先順位は not > and > or）\na = (1 == 1)\nb = (1 == 2)\n表示する(\"a or b and (not b) = \", a or b and (not b))\n\n# 外部からの入力（Pythonのinput()のように、この場でその場で入力できます）\nnamae =【外部からの入力】\n表示する(\"こんにちは、\", namae, \"さん\")\n";
  if (initialIndexBase !== null) indexBaseSelectEl.value = initialIndexBase;
  updateLineNumbers();
  srcEl.addEventListener("input", updateLineNumbers);
  srcEl.addEventListener("scroll", () => {
    lineNumbersEl.scrollTop = srcEl.scrollTop;
  });
  // タブキーでインデント（半角スペース4個）を挿入できるようにする
  srcEl.addEventListener("keydown", (ev) => {
    if (ev.key !== "Tab") return;
    ev.preventDefault();
    const start = srcEl.selectionStart;
    const end = srcEl.selectionEnd;
    srcEl.setRangeText("    ", start, end, "end");
    updateLineNumbers();
  });

  runBtnEl.addEventListener("click", run);
  document.getElementById("clearOutputBtn").addEventListener("click", clearOutput);
  document.getElementById("showTokensBtn").addEventListener("click", showTokens);
  document.getElementById("shareBtn").addEventListener("click", () => {
    showShareUrl(srcEl, sharePanelEl, shareUrlInputEl, qrContainerEl).catch((e) => {
      errorBoxEl.textContent = "共有URLの生成に失敗しました: " + (e && e.message ? e.message : String(e));
      errorBoxEl.style.display = "block";
    });
  });
  document.getElementById("copyShareUrlBtn").addEventListener("click", async () => {
    shareUrlInputEl.select();
    try {
      await navigator.clipboard.writeText(shareUrlInputEl.value);
    } catch (e) {
      // クリップボードAPIが使えない環境では、選択状態にするだけでも
      // 手動コピー（Ctrl+C / Cmd+C）できるようにしておく
    }
  });
  if (!HAS_COMPRESSION_STREAM) {
    document.getElementById("shareBtn").disabled = true;
    document.getElementById("shareBtn").title = "このブラウザは共有URLの生成に対応していません";
  }
  initWasm().catch((e) => {
    errorBoxEl.textContent = "WASM初期化エラー: " + (e && e.message ? e.message : String(e));
    errorBoxEl.style.display = "block";
  });
});
</script>
</body>
</html>
